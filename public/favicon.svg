<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .accent {
      stroke: #0f766e;
    }
    .dot-primary {
      fill: #0f766e;
    }
    .dot-secondary {
      fill: #101214;
    }
    @media (prefers-color-scheme: dark) {
      .accent {
        stroke: #2dd4bf;
      }
      .dot-primary {
        fill: #2dd4bf;
      }
      .dot-secondary {
        fill: #f2f4f7;
      }
    }
  </style>
  <rect
    x="2"
    y="3"
    width="20"
    height="14"
    rx="2.5"
    stroke-width="2.4"
    class="accent"
  />
  <circle cx="8" cy="21" r="2" class="dot-primary" />
  <circle cx="16" cy="21" r="2" class="dot-secondary" />
</svg>
